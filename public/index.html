<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toplantı Odaları</title>
  <style>
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(79, 70, 229, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        #f4f6fb;
      color: #1a2233;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    #splash-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80px;
    }

    .splash-logo-img {
      display: block;
      max-width: 200px;
      max-height: 80px;
      width: auto;
      height: auto;
      object-fit: contain;
    }

    .splash-logo-img.hidden,
    .splash-logo-fallback.hidden {
      display: none;
    }

    .splash-logo-fallback {
      font-size: 56px;
      line-height: 1;
    }

    .splash-title {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
    }

    .splash-status {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 0.95rem;
      color: #5c667a;
    }

    .splash-spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #d8deea;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: splash-spin 0.8s linear infinite;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <link rel="stylesheet" href="/styles.css?v=12">
</head>
<body>
  <div id="splash-screen" aria-live="polite" aria-busy="true">
    <div class="splash-brand">
      <img id="splash-logo-img" class="splash-logo-img __SPLASH_LOGO_IMG_HIDDEN__" src="__LOGO_URL__" alt="Logo" />
      <span id="splash-logo-fallback" class="splash-logo-fallback __SPLASH_LOGO_FALLBACK_HIDDEN__">📹</span>
    </div>
    <div class="splash-title">Toplantı Odaları</div>
    <p class="splash-status" id="splash-status">Bağlanılıyor...</p>
    <div class="splash-spinner" aria-hidden="true"></div>
  </div>

  <div id="app">
    <section id="lobby" class="screen active">
      <div class="lobby-card">
        <div class="logo">
          <img id="site-logo" class="site-logo hidden" alt="Logo" />
          <span id="logo-fallback" class="logo-icon">📹</span>
          <h1>Toplantı Odaları</h1>
          <p>Görüntülü ve sesli canlı toplantı</p>
        </div>

        <form id="join-form">
          <label for="user-name">Adınız</label>
          <input
            id="user-name"
            type="text"
            placeholder="Adınızı girin"
            maxlength="32"
            required
            autocomplete="name"
          />
        </form>

        <p class="section-label">Oda seçin</p>
        <script id="initial-rooms" type="application/json">__ROOMS_JSON__</script>
        <div id="room-list" class="room-grid">__ROOMS_HTML__</div>

        <button type="submit" form="join-form" class="btn btn-primary" id="join-btn" disabled>
          Odaya Katıl
        </button>

        <div class="lobby-footer">
          <a href="/admin.html" class="text-link">Admin Panel →</a>
        </div>
      </div>
    </section>

    <section id="room" class="screen">
      <header class="room-header">
        <div class="room-info">
          <h2 id="room-title">Oda</h2>
          <span id="participant-count" class="badge">0 katılımcı</span>
        </div>
        <div class="room-controls">
          <button id="toggle-mic" class="btn btn-control active" title="Mikrofon">
            <span class="icon">🎤</span>
            <span class="label">Mikrofon</span>
          </button>
          <button id="toggle-cam" class="btn btn-control active" title="Kamera">
            <span class="icon">📷</span>
            <span class="label">Kamera</span>
          </button>
          <button id="toggle-screen" class="btn btn-control" title="Ekran paylaş">
            <span class="icon">🖥️</span>
            <span class="label">Ekran</span>
          </button>
          <button id="leave-btn" class="btn btn-danger" title="Odadan ayrıl">
            Ayrıl
          </button>
        </div>
      </header>

      <main id="video-grid" class="video-grid"></main>
    </section>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/app.js?v=11"></script>
</body>
</html>
